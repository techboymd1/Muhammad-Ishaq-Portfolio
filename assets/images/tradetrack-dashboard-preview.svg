<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">TradeTrack dashboard illustration</title><desc id="desc">A custom illustration of a small business management dashboard with sales, inventory and business activity panels.</desc>
<rect width="1200" height="700" fill="#f4f7fa"/><rect width="240" height="700" fill="#102b3c"/><rect x="26" y="24" width="46" height="46" rx="13" fill="#168878"/><text x="42" y="55" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">T</text><text x="26" y="101" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">TradeTrack</text><text x="26" y="124" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#a5c1c5">BUSINESS MANAGEMENT</text><g font-family="Arial,sans-serif" font-size="14" fill="#d6e3e6"><text x="28" y="190">WORKSPACE</text><rect x="17" y="211" width="206" height="43" rx="8" fill="#164b52"/><text x="39" y="238" fill="#fff" font-weight="700">Overview</text><text x="39" y="294">Products &amp; Stock</text><text x="39" y="340">Sales</text><text x="39" y="386">Customers</text><text x="39" y="432">Expenses</text><text x="28" y="494">INSIGHTS</text><text x="39" y="532">Reports</text></g>
<text x="280" y="55" font-family="Arial,sans-serif" font-size="12" fill="#778995">Workspace　/　Overview</text><text x="280" y="129" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.7" fill="#167b69">BUSINESS MANAGEMENT</text><text x="280" y="182" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#102b3c">Business overview</text><text x="280" y="213" font-family="Arial,sans-serif" font-size="16" fill="#617582">Monitor performance and manage daily operations.</text>
<rect x="280" y="248" width="870" height="118" rx="13" fill="#153b4e"/><circle cx="1070" cy="306" r="108" fill="#168878" opacity=".22"/><text x="310" y="285" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#9ac7bf">TRADETRACK</text><text x="310" y="324" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#fff">Your business, organised.</text><text x="310" y="350" font-family="Arial,sans-serif" font-size="13" fill="#c5d7d9">Manage inventory, sales, customers and expenses.</text>
<g font-family="Arial,sans-serif"><text x="280" y="418" font-size="19" font-weight="700" fill="#102b3c">Business summary</text><rect x="280" y="440" width="200" height="112" rx="10" fill="#fff" stroke="#d9e2e7"/><rect x="500" y="440" width="200" height="112" rx="10" fill="#fff" stroke="#d9e2e7"/><rect x="720" y="440" width="200" height="112" rx="10" fill="#fff" stroke="#d9e2e7"/><rect x="940" y="440" width="210" height="112" rx="10" fill="#fff" stroke="#d9e2e7"/><text x="300" y="470" font-size="12" fill="#627582">Sales today</text><text x="300" y="519" font-size="29" font-weight="700" fill="#153b4e">—</text><text x="520" y="470" font-size="12" fill="#627582">Products in stock</text><text x="520" y="519" font-size="29" font-weight="700" fill="#153b4e">—</text><text x="740" y="470" font-size="12" fill="#627582">Monthly expenses</text><text x="740" y="519" font-size="29" font-weight="700" fill="#153b4e">—</text><text x="960" y="470" font-size="12" fill="#627582">Estimated net profit</text><text x="960" y="519" font-size="29" font-weight="700" fill="#168878">—</text><rect x="280" y="578" width="540" height="91" rx="10" fill="#fff" stroke="#d9e2e7"/><text x="304" y="612" font-size="16" font-weight="700" fill="#102b3c">Recent activity</text><text x="304" y="642" font-size="12" fill="#627582">Sales, stock changes and expense records in one place.</text><rect x="840" y="578" width="310" height="91" rx="10" fill="#fff" stroke="#d9e2e7"/><text x="864" y="612" font-size="16" font-weight="700" fill="#102b3c">Inventory health</text><text x="864" y="642" font-size="12" fill="#627582">Low-stock items need attention.</text></g></svg>
